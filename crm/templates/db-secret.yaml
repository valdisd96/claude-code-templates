{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-db-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete,pre-upgrade,pre-install
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
data:
  ADMIN_DB_USER: {{ .Values.database.admin.user | b64enc | quote }}
  ADMIN_DB_PASSWORD: {{ .Values.database.admin.password | b64enc | quote }}
{{- end }}
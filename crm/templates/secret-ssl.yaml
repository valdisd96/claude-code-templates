{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-ssl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labelsConfigmapSecret" . | nindent 4 }}
type: Opaque
data:
  cloudfront_asset.pem: {{ .Values.cloudfront.ssl_cloudfront_asset_pem | quote }}
{{- end }}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "chart.fullname" . }}-env-sensitive
  labels:
    {{- include "chart.labelsConfigmapSecret" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
spec:
  {{- with .Values.externalSecrets.secretStoreRef }}
  secretStoreRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  refreshInterval: "0"
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: {{ include "chart.fullname" . }}-env-sensitive
  dataFrom:
  {{- if .Values.externalSecrets.sharedSecret }}
  - extract:
      decodingStrategy: Auto
      key: {{ include "chart.tplvalues.render" ( dict "value" .Values.externalSecrets.secretPath "context" $ ) }}/shared/env
  {{- end }}
  - extract:
      decodingStrategy: Auto
      key: {{ include "chart.tplvalues.render" ( dict "value" .Values.externalSecrets.secretPath "context" $ ) }}/{{ include "chart.fullname" . }}/env
      version: {{ .Values.appConfig.appSecretsVersion | quote }}
{{- end }}

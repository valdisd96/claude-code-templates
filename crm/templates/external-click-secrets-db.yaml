{{- if and (.Values.externalSecrets.enabled) (eq .Values.database.main.dbDev "true") (eq .Values.database.clickhouse.dbDev "true") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "chart.fullname" . }}-db-click-admin
  labels:
    {{- include "chart.labelsConfigmapSecret" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete,post-upgrade,pre-upgrade,pre-install
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- with .Values.externalSecrets.secretStoreRef }}
  secretStoreRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  refreshInterval: "0"
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: {{ include "chart.fullname" . }}-db-click-admin
  dataFrom:
  - extract:
      decodingStrategy: Auto
      key: {{ include "chart.tplvalues.render" ( dict "value" .Values.externalSecrets.secretPath "context" $ ) }}/shared/DB/main-dev-clickhouse-db-admin-secrets
      version: {{ .Values.database.clickhouse.adminSecretsVersion | quote }}
{{- end }}

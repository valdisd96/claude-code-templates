{{- if eq .Values.database.main.dbDev "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-delete-db
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      name: {{ .Chart.Name }}-delete-db-pod
      labels:
        app: {{ .Chart.Name }}-delete-db
    spec:
      restartPolicy: Never
      containers:
        - name: delete-db
          image: "{{ .Values.database.main.postgres.image }}:{{ .Values.database.main.postgres.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Dropping DB if exists"
              PGPASSWORD=${ADMIN_DB_PASSWORD} psql -h ${MAIN_DB_HOST} -p ${MAIN_DB_PORT} -U ${ADMIN_DB_USER} -d postgres -c "SELECT 1 FROM pg_database WHERE datname = '${MAIN_DB_NAME}'" | grep -q 1 && \
              PGPASSWORD=${ADMIN_DB_PASSWORD} psql -h ${MAIN_DB_HOST} -p ${MAIN_DB_PORT} -U ${ADMIN_DB_USER} -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${MAIN_DB_NAME}' AND pid <> pg_backend_pid();" && \
              PGPASSWORD=${POSTGRES_DB_PASSWORD} psql -h ${MAIN_DB_HOST} -p ${MAIN_DB_PORT} -U ${POSTGRES_DB_USERNAME} -d postgres -c "DROP DATABASE \"${MAIN_DB_NAME}\";" || echo "Current database does not exist... skip"
              sleep 1
          envFrom:
            - secretRef:
                name: {{ include "chart.fullname" . }}-env-sensitive
            - configMapRef:
                name: {{ include "chart.fullname" . }}-env-nonsensitive
            - secretRef:
                name: {{ include "chart.fullname" . }}-db-admin
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- end }}
  KAFKA_TOPICS_DELIVERY_BATCH_CONCURRENCY: {{ .Values.kafka.topics.deliveryBatch.concurrency | quote }}
  KAFKA_TOPICS_DELIVERY_BATCH_PARTITIONS: {{ .Values.kafka.topics.deliveryBatch.partitions | quote }}
  KAFKA_TOPICS_DELIVERY_BATCH_REPLICAS: {{ .Values.kafka.topics.deliveryBatch.replicas | quote }}
  KAFKA_TOPICS_DELIVERY_BATCH_RETENTION_BYTES: {{ .Values.kafka.topics.deliveryBatch.retentionBytes | quote }}

  KAFKA_TOPICS_DELIVERY_BATCH_DLQ_PARTITIONS: {{ .Values.kafka.topics.deliveryBatchDlq.partitions | quote }}
  KAFKA_TOPICS_DELIVERY_BATCH_DLQ_REPLICAS: {{ .Values.kafka.topics.deliveryBatchDlq.replicas | quote }}
  KAFKA_TOPICS_DELIVERY_BATCH_DLQ_RETENTION_BYTES: {{ .Values.kafka.topics.deliveryBatchDlq.retentionBytes | quote }}
  KAFKA_TOPICS_DELIVERY_BATCH_DLQ_RETENTION_MS: {{ .Values.kafka.topics.deliveryBatchDlq.retentionMs | quote }}


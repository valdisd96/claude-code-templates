  KAFKA_TOPICS_GAME_INFO_CONCURRENCY: {{ .Values.kafka.topics.gameInfo.concurrency | quote }}
  KAFKA_TOPICS_GAME_INFO_PARTITIONS: {{ .Values.kafka.topics.gameInfo.partitions | quote }}

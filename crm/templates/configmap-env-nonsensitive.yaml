apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-env-nonsensitive
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
  labels:
    {{- include "chart.labelsConfigmapSecret" . | nindent 4 }}
data:
  GLOBAL_DOMAIN_URL: {{ tpl .Values.appConfig.domain . }}
  POSTGRES_DB_URL: jdbc:postgresql://${MAIN_DB_HOST}:${MAIN_DB_PORT}/${MAIN_DB_NAME}
  CLICKHOUSE_URL: https://${MAIN_CLICK_DB_HOST}:${MAIN_CLICK_DB_PORT}
  HIKARI_MINIMUM_IDLE: {{ .Values.database.main.minimumIdle | quote  }}
  HIKARI_MAXIMUM_POOL_SIZE: {{ .Values.database.main.maximumPoolSize | quote  }}
  JAVA_XMS: {{ .Values.java.javaXms | quote }}
  JAVA_XMX: {{ .Values.java.javaXmx | quote }}
{{- if .Values.jmxAgent.enabled }}
  JAVA_OPTS: {{ .Values.java.javaOpts }} {{ tpl .Values.jmxAgent.javaOpts . }}
{{- else }}
  JAVA_OPTS: {{ .Values.java.javaOpts | quote }}
{{- end }}
  OPENSEARCH_HOST: {{ .Values.openSearch.host }}
  OPENSEARCH_PROTO: {{ .Values.openSearch.protocol }}
  OPENSEARCH_PORT: {{ .Values.openSearch.port | quote }}
  OPENSEARCH_URL: {{ .Values.openSearch.url }}
  OPENSEARCH_INDEX: {{ tpl .Values.openSearch.index . }}

  MAIN_DB_HOST: {{ .Values.database.main.host | quote }}
  MAIN_DB_PORT: {{ .Values.database.main.port | quote }}
  MAIN_DB_NAME: {{ include "chart.db_name" . | quote }}
  POSTGRES_DB_USERNAME: {{ include "chart.db_username" . | quote }}

  AWS_REGION: {{ .Values.glue.awsRegion | quote }}
  ACCOUNT_ID: {{ .Values.kafka.acountId | quote }}
  MSK_IAM_ROLE_NAME: {{ .Values.kafka.mskIamRoleName | quote }}
  MSK_IAM_STATIC_SESSION_NAME: {{ .Values.kafka.mskIamStaticSessionName | quote }}
  SCHEMA_REGISTRY_NAME: {{ .Values.kafka.schemaRegistryName | quote }}
  SCHEMA_REGISTRY_URL: {{ .Values.kafka.springKafkaConsumerPropertiesSchemaRegistry | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.springKafkaBootstrapServers | quote }}

  KAFKA_TOPICS_USER_ACTION_NAME: {{ .Release.Namespace }}.{{ include "chart.name" . }}.{{ .Values.kafka.topics.userAction.name }}
  KAFKA_TOPICS_USER_ACTION_CONCURRENCY: {{ .Values.kafka.topics.userAction.concurrency | quote }}
  KAFKA_TOPICS_USER_ACTION_PARTITIONS: {{ .Values.kafka.topics.userAction.partitions | quote }}
  KAFKA_TOPICS_USER_ACTION_REPLICAS: {{ .Values.kafka.topics.userAction.replicas | quote }}
  KAFKA_TOPICS_USER_ACTION_RETENTION_BYTES: {{ .Values.kafka.topics.userAction.retentionBytes | quote }}
  KAFKA_TOPICS_USER_ACTION_RETENTION_MS: {{ .Values.kafka.topics.userAction.retentionMs | quote }}

  KAFKA_TOPICS_USER_INFO_NAME: {{ .Release.Namespace }}.{{ include "chart.name" . }}.{{ .Values.kafka.topics.userInfo.name }}
  KAFKA_TOPICS_USER_INFO_CONCURRENCY: {{ .Values.kafka.topics.userInfo.concurrency | quote }}
  KAFKA_TOPICS_USER_INFO_PARTITIONS: {{ .Values.kafka.topics.userInfo.partitions | quote }}
  KAFKA_TOPICS_USER_INFO_REPLICAS: {{ .Values.kafka.topics.userInfo.replicas | quote }}

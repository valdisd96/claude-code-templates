  KAFKA_TOPICS_MIGRATION_MAINTENANCE_CONCURRENCY: {{ .Values.kafka.topics.migrationMaintenance.concurrency | quote }}
  KAFKA_TOPICS_MIGRATION_MAINTENANCE_PARTITIONS: {{ .Values.kafka.topics.migrationMaintenance.partitions | quote }}
  KAFKA_TOPICS_MIGRATION_MAINTENANCE_REPLICAS: {{ .Values.kafka.topics.migrationMaintenance.replicas | quote }}
  KAFKA_TOPICS_MIGRATION_MAINTENANCE_RETENTION_BYTES: {{ .Values.kafka.topics.migrationMaintenance.retentionBytes | quote }}
  KAFKA_TOPICS_MIGRATION_MAINTENANCE_RETENTION_MS: {{ .Values.kafka.topics.migrationMaintenance.retentionMs | quote }}

  KAFKA_TOPICS_PLAYER_TAGS_NAME: {{ .Release.Namespace }}.{{ include "chart.name" . }}.{{ .Values.kafka.topics.playerTags.name }}
  KAFKA_TOPICS_PLAYER_TAGS_CONCURRENCY: {{ .Values.kafka.topics.playerTags.concurrency | quote }}
  KAFKA_TOPICS_PLAYER_TAGS_PARTITIONS: {{ .Values.kafka.topics.playerTags.partitions | quote }}
  KAFKA_TOPICS_PLAYER_TAGS_REPLICAS: {{ .Values.kafka.topics.playerTags.replicas | quote }}
  KAFKA_TOPICS_PLAYER_TAGS_RETENTION_BYTES: {{ .Values.kafka.topics.playerTags.retentionBytes | quote }}
  KAFKA_TOPICS_PLAYER_TAGS_RETENTION_MS: {{ .Values.kafka.topics.playerTags.retentionMs | quote }}

  KAFKA_TOPICS_INGESTION_EVENT_NAME: {{ .Release.Namespace }}.{{ include "chart.name" . }}.{{ .Values.kafka.topics.ingestionEvent.name }}
  KAFKA_TOPICS_INGESTION_EVENT_CONCURRENCY: {{ .Values.kafka.topics.ingestionEvent.concurrency | quote }}
  KAFKA_TOPICS_INGESTION_EVENT_PARTITIONS: {{ .Values.kafka.topics.ingestionEvent.partitions | quote }}
  KAFKA_TOPICS_INGESTION_EVENT_REPLICAS: {{ .Values.kafka.topics.ingestionEvent.replicas | quote }}
  KAFKA_TOPICS_INGESTION_EVENT_RETENTION_BYTES: {{ .Values.kafka.topics.ingestionEvent.retentionBytes | quote }}
  KAFKA_TOPICS_INGESTION_EVENT_RETENTION_MS: {{ .Values.kafka.topics.ingestionEvent.retentionMs | quote }}


  MAIN_CLICK_DB_HOST: {{ .Values.database.clickhouse.host | quote }}
  MAIN_CLICK_DB_PORT: {{ .Values.database.clickhouse.port | quote }}
  CLICKHOUSE_DATABASE: {{ include "chart.db_click_name" . | quote }}
  CLICKHOUSE_USERNAME: {{ include "chart.db_click_username" . | quote }}
  CLICKHOUSE_INSERT_MAX_CONNECTIONS: {{ .Values.database.clickhouse.insertMaxConnections | quote }}
  CLICKHOUSE_INSERT_THREAD_COUNT: {{ .Values.database.clickhouse.insertThreadCount | quote }}
  CLICKHOUSE_QUERY_MAX_CONNECTIONS: {{ .Values.database.clickhouse.queryMaxConnections | quote }}

  CURRENCY_EXCHANGE_URL: {{ .Values.currencyExchange.url | quote }}

  COMMUNICATION_DO_SEND: {{ .Values.appConfig.communicationDoSend | quote }}
  REQUEST_EXPIRES_IN_SECONDS: {{ .Values.appConfig.requestExpiresInSeconds | quote }}

  AWS_CLOUDFRONT_PRIVATE_KEY_PATH: {{ .Values.cloudfront.asset.privateKeyPath }}
  AWS_CLOUDFRONT_KEY_PAIR_ID: {{ .Values.cloudfront.asset.keyPairId }}
  AWS_CLOUDFRONT_DOMAIN: {{ .Values.cloudfront.asset.domain }}
  AWS_CLOUDFRONT_ALTERNATE_DOMAIN: {{ .Values.cloudfront.asset.alternateDomain }}

  AWS_S3_BUCKET: {{ .Values.s3.asset.bucket }}
  AWS_S3_REGION: {{ .Values.s3.asset.region }}
  AWS_S3_PREFIX: {{ .Release.Namespace }}/

  GLOBAL_ENV: {{ .Release.Namespace }}
  SECURITY_AUTH_ENABLED: {{ .Values.appConfig.securityAuthEnabled | quote }}
  AUTHORIZATION_SERVER_URI: {{ .Values.appConfig.authorizationServerUri | quote }}

  {{- if .Values.datadog.enabled }}
  DD_DATA_STREAMS_ENABLED: "true"
  {{- end }}

  GLOBAL_FE_DOMAIN_URL:  {{ tpl .Values.appConfig.frontendUrl . | quote }}

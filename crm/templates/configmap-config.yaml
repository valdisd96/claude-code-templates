apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
  labels:
    {{- include "chart.labelsConfigmapSecret" . | nindent 4 }}
data:
  {{- range $path, $config := .Values.configTemplate }}
  {{ $path }}: |
    {{- tpl $config $ | nindent 4 }}
  {{- end }}
  {{- range $path, $config := .Values.configPlain }}
  {{ $path }}: |
    {{- $config | nindent 4}}
  {{- end }}

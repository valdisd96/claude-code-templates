{{- if .Values.ingress.enabled -}}
{{- $svcPort := .Values.service.port -}}
{{- $fullName := include "chart.fullname" . -}}
{{- range $index, $config := .Values.ingress.configurations }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{- if eq $index 0 }} {{ $fullName }} {{- else }} {{ $fullName }}-{{ $index }} {{- end }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .className | default $.Values.ingress.className }}
  {{- if .tls }}
  tls:
    {{- range .tls }}
    - hosts:
        {{- range .hosts }}
        - {{ tpl . $ | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .hosts }}
    - host: {{ tpl .host $ | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .servicePort | default $svcPort }}
          {{- end }}
    {{- end }}
{{ "---" }}
{{- end }}
{{- end }}

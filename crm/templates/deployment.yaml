apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app: {{ .Chart.Name }}
    {{- if .Values.datadog.enabled }}
    tags.datadoghq.com/env: {{ .Values.datadog.env }}
    tags.datadoghq.com/service: {{ include "chart.fullname" . }}
    tags.datadoghq.com/version: {{ .Values.image.tag }}
    {{- end }}
  {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.appConfig.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        app: {{ .Chart.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.datadog.enabled }}
        admission.datadoghq.com/enabled: "true"
        tags.datadoghq.com/env: {{ .Values.datadog.env }}
        tags.datadoghq.com/service: {{ include "chart.fullname" . }}
        tags.datadoghq.com/version: {{ .Values.image.tag }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-config.yaml") . | sha256sum }}
        checksum/env-nonsensitive: {{ include (print $.Template.BasePath "/configmap-env-nonsensitive.yaml") . | sha256sum }}
        checksum/env-sensitive: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.datadog.enabled }}
        admission.datadoghq.com/java-lib.version: {{ .Values.datadog.javaLibVersion }}
        {{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- tpl .Values.affinity . | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          {{- if .Values.extraEnvs }}
          {{- toYaml .Values.extraEnvs | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "chart.fullname" . }}-env-sensitive
            - configMapRef:
                name: {{ include "chart.fullname" . }}-env-nonsensitive
          ports:
            - name: {{ .Values.ports.nameContainerPort }}
              containerPort: {{ .Values.ports.containerPort }}
            - name: {{ .Values.ports.nameHealthCheckPort }}
              containerPort: {{ .Values.ports.healthCheckPort }}
          {{- if .Values.jmxAgent.enabled }}
            - name: {{ .Values.jmxAgent.ports.name }}
              containerPort: {{ .Values.jmxAgent.ports.containerPort }}
          {{- end }}  
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ include "chart.fullname" . }}-config
              mountPath: {{ .Values.volumeMounts.mountPath }}
            - name: {{ include "chart.fullname" . }}-ssl-cloudfront
              mountPath: /home/gradle/src/external_resources/encrypt_keys/cloudfront
      volumes:
        - name: {{ include "chart.fullname" . }}-config
          configMap:
            name: {{ include "chart.fullname" . }}-config
        - name: {{ include "chart.fullname" . }}-ssl-cloudfront
          secret:
            secretName: {{ include "chart.fullname" . }}-ssl
            items:
            - key: "cloudfront_asset.pem"
              path: "private_asset.pem" 
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}

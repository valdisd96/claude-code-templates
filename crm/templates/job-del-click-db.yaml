{{- if eq .Values.database.clickhouse.dbDev "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-delete-clickhouse-db
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      name: {{ .Chart.Name }}-delete-click-db-pod
      labels:
        app: {{ .Chart.Name }}-delete-click-db
    spec:
      restartPolicy: Never
      containers:
        - name: delete-click-db
          image: repository.spribe.io/dockerhub/curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Dropping Clickhouse DB if exists"
              curl --fail -u ${ADMIN_CLICK_DB_USER}:"${ADMIN_CLICK_DB_PASSWORD}" -X POST \
                "https://${MAIN_CLICK_DB_HOST}:${MAIN_CLICK_DB_PORT}/" \
                --data-binary "DROP DATABASE IF EXISTS ${CLICKHOUSE_DATABASE};"

              curl --fail -u ${ADMIN_CLICK_DB_USER}:"${ADMIN_CLICK_DB_PASSWORD}" -X POST \
                "https://${MAIN_CLICK_DB_HOST}:${MAIN_CLICK_DB_PORT}/" \
                --data-binary "DROP USER IF EXISTS ${CLICKHOUSE_USERNAME};"
          envFrom:
            - secretRef:
                name: {{ include "chart.fullname" . }}-env-sensitive
            - configMapRef:
                name: {{ include "chart.fullname" . }}-env-nonsensitive
            - secretRef:
                name: {{ include "chart.fullname" . }}-db-click-admin
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-env-sensitive
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labelsConfigmapSecret" . | nindent 4 }}
type: Opaque
data:
  CLICKHOUSE_PASSWORD: {{ .Values.database.clickhouse.password | b64enc | quote }}
  POSTGRES_DB_PASSWORD: {{ .Values.database.main.password | b64enc | quote }}
  BREVO_CALLBACK_TOKEN: {{ .Values.communication.provider.brevo.callback_token | quote }}
  INFOBIP_CALLBACK_TOKEN: {{ .Values.communication.provider.infobip.callback_token | quote }}
  OPENSEARCH_USER: {{ .Values.openSearch.user | b64enc | quote }}
  OPENSEARCH_PASS: {{ .Values.openSearch.password | b64enc | quote }}
  SECURITY_AUTH_CLIENT_ID: {{ .Values.appConfig.security.auth.client.id | b64enc | quote }}
  SECURITY_AUTH_CLIENT_SECRET: {{ .Values.appConfig.security.auth.client.secret | b64enc | quote }}
{{- end }}

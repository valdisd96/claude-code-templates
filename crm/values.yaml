image:
  repository: "repository.spribe.io/container-registry"
  name: crm
  tag: ""
  pullPolicy: Always

# String to partially override crm.fullname template (will maintain the release name)
nameOverride: ""

# String to fully override crm.fullname template
fullnameOverride: ""

volumeMounts:
  mountPath: "/opt/crm/config"

extraEnvs: []

annotations: {}

# Secret name to allow kubelet to authentication in Docker-registry for image download
imagePullSecrets:
  - harbor-pull-secret

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

nodeSelector: {}

tolerations: []

# Affinity for pod assignment.
affinity: |-
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - {{ .Chart.Name }}
      namespaces:
        - {{ .Release.Namespace | quote }}
      topologyKey: "kubernetes.io/hostname"

# Pod Security Context
podSecurityContext: {}

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

automountServiceAccountToken: true

# Default duration in seconds k8s waits for container to exit before sending kill signal. Default 30 seconds
terminationGracePeriodSeconds: {}

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]

# Add init containers to the pod
initContainers: []

serviceAccount:
  create: false
  annotations: {}
  name: ""

# Pod Disruption Budget configuration
podDisruptionBudget: {}

service:
  annotations: {}
  type: ClusterIP
  port: 80
  protocol: TCP
  portname: crm-http

ports:
  containerPort: 8080
  nameContainerPort: http
  healthCheckPort: 8082
  nameHealthCheckPort: healthcheck

ingress:  
  enabled: false
  configurations:
    - className: "nginx"
      hosts:
      - host: 
        paths:
          - path: "/"

datadog:
  enabled: false
  javaLibVersion: "v1.54.0"
  env: "dev"
  service: "crm"

migrations:
  insertTestData: false

moniringEnable: "false"

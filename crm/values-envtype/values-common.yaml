s3:
  asset:
    bucket: main-dev-spribe-crm-asset-library
    region: eu-west-1
cloudfront:
  asset:
      keyPairId: K167TV8X0JW99L
      domain: d338zvf94lbds6.cloudfront.net
      alternateDomain: crm-asset-library-dev.main.spribe.dev
      privateKeyPath: external_resources/encrypt_keys/cloudfront/private_asset.pem

currencyExchange:
  url: "http://currency-exchange.currency-exchange:4412/api"

configTemplate:
  application.properties: |-
    currency:
      exchange:
        url: ${currency_exchange_url:https://ce-api.staging.spribe.io/api}

configPlain:

openSearch:
  index: spribe-dev-spribe-crm-{{ .Release.Namespace }}
  host: opensearch.main.spribe.dev
  url: _bulk
  protocol: https
  port: 443

externalSecrets:
  enabled: true
  sharedSecret: false
  secretPath: "main-dev"
  secretStoreRef:
    name: global-secret-store
    kind: ClusterSecretStore

resources:
  limits:
    cpu: 300m
    memory: 1024Mi
  requests:
    cpu: 68m
    memory: 558Mi

startupProbe:
  failureThreshold: 15
  httpGet:
    path: /internal/actuator/health
    port: healthcheck
    scheme: HTTP
  initialDelaySeconds: 100
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5
readinessProbe:
  failureThreshold: 2
  httpGet:
    path: /internal/actuator/health/readiness
    port: healthcheck
    scheme: HTTP
  initialDelaySeconds: 1
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5
livenessProbe:
  failureThreshold: 2
  httpGet:
    path: /internal/actuator/health/liveness
    port: healthcheck
    scheme: HTTP
  initialDelaySeconds: 1
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

podLabels:
  kafka-client: "true"
  schema-registry-client: "true"

ingress:  
  enabled: true
  configurations:
    - className: "nginx"
      hosts:
      - host: crm-back-{{ .Release.Namespace }}.main.spribe.dev
        paths:
          - path: "/"


migrations:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  backoffLimit: 2
  activeDeadlineSeconds: 270
  restartPolicy: Never
  insertTestData: true ## only needs for dev and qa envs
  resources:
    limits:
      cpu: 1024m
      memory: 2048Mi
    requests:
      cpu: 1m
      memory: 128Mi

serviceAccount:
  create: true
  annotations: {}
  name: ""

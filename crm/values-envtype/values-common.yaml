      concurrency: 1
      partitions: 1
      replicas: 1
      retentionBytes: "-1"
      retentionMs: "604800000"
    workflowTriggerEvent:
      name: workflow-trigger-event
      concurrency: 1
      partitions: 1
      replicas: 1
      retentionBytes: "-1"
      retentionMs: "604800000"
    templateAction:
      name: template-action
      concurrency: 1
      partitions: 1
      replicas: 1
      retentionBytes: "-1"
      retentionMs: "604800000"
    deliveryAction:
      name: delivery-action
      concurrency: 1
      partitions: 1
      replicas: 1
      retentionBytes: "-1"
      retentionMs: "604800000"
    deliveryBatch:
      name: delivery-batch
      concurrency: 1
      partitions: 1
      replicas: 1
      retentionBytes: "-1"
      retentionMs: "604800000"
    deliveryBatchRetry:
      name: delivery-batch-retry
      concurrency: 1
      partitions: 1
      replicas: 1
      retentionBytes: "-1"
      retentionMs: "604800000"
    deliveryBatchDlq:
      name: delivery-batch-dlq
      concurrency: 1
      partitions: 1
      replicas: 1
      retentionBytes: "-1"
      retentionMs: "604800000"
    cacheInvalidation:
      name: cache-invalidation
      concurrency: 1

database:
  main:
    host: 10.15.138.141
    port: 6543
    minimumIdle: 0
    maximumPoolSize: 2
    recreateDB: false
    dbDev: "true"
    postgres:
      image: repository.spribe.io/registry-open/postgres
      tag: "17.5"
    adminSecretsVersion: "2"
  clickhouse:
    dbDev: "true"
    host: bv7mimnxsg.eu-west-1.vpce.aws.clickhouse.cloud
    port: 8443
    insertMaxConnections: 30
    insertThreadCount: 30
    queryMaxConnections: 30
    adminSecretsVersion: "2"

appConfig:
  domain: "crm-back-{{ .Release.Namespace }}.main.spribe.dev"
  frontendUrl: https://crm-{{ .Release.Namespace }}.main.spribe.dev
  appName: crm
  replicaCount: 1
  communicationDoSend: false
  requestExpiresInSeconds: "3600"
  appSecretsVersion: "25"
  appSslSecretsVersion: "1"
  securityAuthEnabled: false
  authorizationServerUri: http://broadway-auth-service:9031

java:
  javaXms: -Xms512M
  javaXmx: -Xmx1024M
  javaOpts: -Dcom.redhat.fips=false

jmxAgent:
  enabled: true
  javaOpts: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.port={{ .Values.jmxAgent.ports.containerPort }} -Dcom.sun.management.jmxremote.rmi.port={{ .Values.jmxAgent.ports.containerPort }} -Djava.rmi.server.hostname={{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
  ports:
    name: jmx-port
    containerPort: 1099

glue:
  awsRegion: "eu-west-1"

kafka:
  acountId: "542610934796"
  mskIamRoleName: "fixed_session_name_for_crm"
  mskIamStaticSessionName: "crm"
  schemaRegistryName: "spribe-dev-msk1"
  springKafkaBootstrapServers: "b-3.spribedevmsk1.9i05xt.c9.kafka.eu-west-1.amazonaws.com:9098,b-1.spribedevmsk1.9i05xt.c9.kafka.eu-west-1.amazonaws.com:9098,b-2.spribedevmsk1.9i05xt.c9.kafka.eu-west-1.amazonaws.com:9098"
  springKafkaConsumerPropertiesSchemaRegistry: ""
  topics:
    userAction:
      name: user-action
      concurrency: 1
      partitions: 1
      replicas: 1
      retentionBytes: "-1"
      retentionMs: "604800000"
